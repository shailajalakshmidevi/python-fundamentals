apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-analyzer
  template:
    metadata:
      labels:
        app: text-analyzer
    spec:
      containers:
      - name: text-analyzer
        image: text-analyzer
        command: ["python3", "projects/text_analyzer/main.py"]
        args: ["sample.txt"]
